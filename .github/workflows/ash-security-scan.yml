name: ASH Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/*.sh"
      - "**/*.md"
      - ".github/workflows/ash-security-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed scannable files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.yaml
            **/*.yml
            **/*.json
            **/*.sh
            **/*.md

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ASH
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pip install git+https://github.com/awslabs/automated-security-helper.git@v3.2.6

      - name: Copy changed files for scanning
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          mkdir -p /tmp/ash-scan
          echo "Changed files selected for ASH:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n'

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$file" ]; then
              mkdir -p "/tmp/ash-scan/$(dirname "$file")"
              cp "$file" "/tmp/ash-scan/$file"
            fi
          done

      - name: Run ASH scan on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd /tmp/ash-scan
          ash --mode container 2>&1 | tee /tmp/ash-output.log

      - name: Add ASH summary
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "## ASH Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/ash-output.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 /tmp/ash-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Skip message
        if: steps.changed-files.outputs.any_changed == 'false'
        run: echo "No scannable files changed - skipping ASH scan"
